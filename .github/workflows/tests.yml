name: Tests

# The image build proves that the tree compiles; this job proves that it works.
# It builds the front end because server/listen/http_server embeds its dist/,
# runs the front-end tests, then runs the Go suite - including the root package,
# which starts the real server on its low ports. GitHub's runner can bind those
# after the sysctl step below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet, front-end tests and Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep only the newest three runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-runs.sh 3


      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: fe/yarn.lock

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      # The Chrome test drives a real browser. One retry absorbs the occasional
      # navigation flake; --disable-dev-shm-usage keeps it off the small /dev/shm
      # a hosted runner provides.
      - name: Build and test the front end
        working-directory: fe
        run: |
          yarn install --frozen-lockfile
          yarn test || { echo "::warning::retrying the front-end tests once"; yarn test; }
          yarn build

      # server/listen/http_server embeds dist/*, so the Go build needs the front
      # end in place even for a test run.
      - name: Copy the front end into the embedded path
        run: |
          rm -rf server/listen/http_server/dist
          cp -r fe/dist server/listen/http_server/dist

      - name: Vet
        working-directory: server
        run: go vet ./...

      # main_test.go and the IMAP/POP3 tests load ./config/ssl/{private.key,
      # public.crt}; those files are gitignored operator data, so CI creates a
      # throwaway self-signed pair before the suite.
      - name: Create the TLS fixture for the integration tests
        run: |
          mkdir -p server/config/ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout server/config/ssl/private.key \
            -out server/config/ssl/public.crt \
            -subj "/CN=localhost"

      # main_test.go starts the real server: SMTP on 25, HTTP on 80, HTTPS on
      # 443 and submission on 587, before it moves the API to setup_port. A
      # GitHub-hosted runner is not root, so lower the unprivileged floor.
      - name: Allow the integration test to bind its low ports
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0

      - name: Go tests
        working-directory: server
        env:
          setup_port: 17888
          IMAIL_ROOT: ${{ github.workspace }}/server/
        run: go test -p 1 ./...

  # The queue and the webmail composer are the parts that talk to a database
  # directly, so they run against the two server databases the project supports.
  # Schema and timestamp differences (xorm's Sync2, DATETIME precision, the
  # reserved `user` table) only show up here.
  databases:
    name: Queue and webmail tests on ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            backend: mysql
            dsn: root:githubTest@tcp(127.0.0.1:3306)/imail?parseTime=True&loc=UTC
          - name: PostgreSQL 16
            backend: postgres
            dsn: postgres://postgres:githubTest@127.0.0.1:5432/imail?sslmode=disable
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: githubTest
          MYSQL_DATABASE: imail
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgithubTest"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: githubTest
          POSTGRES_DB: imail
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # -p 1: the tests rebuild the shared schema once per process, so the
      # packages must not run at the same time against the same database.
      - name: Go tests against ${{ matrix.name }}
        working-directory: server
        env:
          IMAIL_TEST_DB: ${{ matrix.backend }}
          IMAIL_TEST_DSN: ${{ matrix.dsn }}
        run: go test -p 1 ./services/queue/ ./controllers/email/

      - name: Keep only the newest three runs (final)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-runs.sh 3
